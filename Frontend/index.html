<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Vivek Rana | MERN Stack Developer</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Vivek Rana is a MERN Stack Developer specializing in React.js, Node.js, Express.js, and MongoDB. Explore projects, skills, experience, and contact information."
    />
    <meta
      name="keywords"
      content="Vivek Rana, MERN Stack Developer, React Developer, Frontend Developer, Full Stack Developer, JavaScript, React.js, Node.js, Express.js, MongoDB, Portfolio"
    />
    <meta name="author" content="Vivek Rana" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Canonical -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vivek Rana | MERN Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio of Vivek Rana showcasing MERN Stack projects, technical skills, and professional experience."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:image" content="https://yourdomain.com/preview.png" />
    <meta property="og:site_name" content="Vivek Rana Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vivek Rana | MERN Stack Developer" />
    <meta
      name="twitter:description"
      content="Explore the portfolio of Vivek Rana - MERN Stack Developer."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/preview.png"
    />

    <!-- Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
